name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          prompt: |
            You are triaging GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.

            1. Read the issue title and body with `gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }}`.
            2. List the repository's existing labels with `gh label list --repo ${{ github.repository }}` and pick the labels that best match this issue (e.g. bug, enhancement, documentation, question, priority level, area/component labels). Only use labels that already exist in the repo; do not invent new ones.
            3. Apply the chosen labels with `gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label "label1,label2"`. If labels are already correct, you may leave them or refine them.
            4. Briefly inspect the codebase (relevant files, recent related code) to understand where this issue likely originates.
            5. Post a single diagnostic comment on the issue with `gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "..."` containing:
               - A short restatement of the problem/request
               - A likely root cause or the area of the codebase involved (with file paths if relevant)
               - A suggested approach for implementing the fix or feature
               - Any missing information needed from the reporter, if applicable

            Keep the comment concise and actionable. Do not make code changes; only label and comment.

          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"
